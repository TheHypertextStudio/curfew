  - CurfewKit/Sources/CurfewKit/Infrastructure/RestCompanionPresentationStore.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseDisplayDelivery.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunrisePowerIO+Live.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunrisePowerIO.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakeCoordinator.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakeJournal.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakePlan.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakeScheduler.swift
  - CurfewKit/Sources/CurfewKit/Settings/RestAppearancePreferences.swift
  - CurfewKit/Sources/CurfewKit/Settings/RestAppearancePreferencesStore.swift
  - CurfewKit/Tests/CurfewAtmosphereTests/RestAmbientSceneTests.swift
  - CurfewKit/Tests/CurfewAtmosphereTests/RestBackgroundImageStoreTests.swift
  - CurfewKit/Tests/CurfewAtmosphereTests/RestScreenSaverPreferencesTests.swift
  - CurfewKit/Tests/CurfewAtmosphereTests/RestScreenSaverSessionTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestAppearancePreferencesTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestAppearanceSyncIsolationTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestCompanionExportTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestCompanionPresentationStoreTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestCompanionSceneBridgeTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestHandoffPolicyTests.swift
  - CurfewKit/Tests/CurfewKitTests/RestSceneSnapshotTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseDaemonServiceTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseDisplayDeliveryTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunrisePowerIOTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseWakeCoordinatorTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseWakeJournalTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseWakePlannerTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseWakeSchedulerTests.swift
  - CurfewKit/Tests/CurfewKitTests/SunriseScheduleIndependenceTests.swift

excluded:
  - DerivedData
  - build
  - .build
  - .swiftpm

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - redundant_nil_coalescing

# `missing_docs` lives in `.swiftlint-docs.yml` (invoked by
# `just docs-coverage`) so it only runs against production source —
# tests document themselves through descriptive function names.
