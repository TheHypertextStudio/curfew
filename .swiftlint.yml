# SwiftLint config for Curfew
# Uses default rules and thresholds.

included:
  - Curfew
  - CurfewTests
  - CurfewUITests

excluded:
  - DerivedData
  - build
  - .build
  - .swiftpm

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - redundant_nil_coalescing

# `missing_docs` lives in `.swiftlint-docs.yml` (invoked by
# `just docs-coverage`) so it only runs against production source —
# tests document themselves through descriptive function names.
