# SwiftLint config for Curfew
# Uses default rules and thresholds.

included:
  - Curfew
  - CurfewTests
  - CurfewUITests
  - CurfewScreenSaver
  - CurfewKit/Sources/CurfewAtmosphere
  - CurfewKit/Sources/CurfewKit/Domain/RestCompanionExport.swift
  - CurfewKit/Sources/CurfewKit/Domain/RestHandoffPolicy.swift
  - CurfewKit/Sources/CurfewKit/Domain/RestSceneSnapshot.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/AuthenticatedDaemonService.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/CurfewDaemonProtocol.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/RestCompanionPresentationStore.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseDisplayDelivery.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunrisePowerIO+Live.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunrisePowerIO.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakeJournal.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakePlan.swift
  - CurfewKit/Sources/CurfewKit/Infrastructure/SunriseWakeScheduler.swift
  - CurfewKit/Sources/CurfewKit/Settings/RestAppearancePreferences.swift
  - CurfewKit/Sources/CurfewKit/Settings/RestAppearancePreferencesStore.swift

excluded:
  - DerivedData
  - build
  - .build
  - .swiftpm

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - redundant_nil_coalescing

# `missing_docs` lives in `.swiftlint-docs.yml` (invoked by
# `just docs-coverage`) so it only runs against production source —
# tests document themselves through descriptive function names.
