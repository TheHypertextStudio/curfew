# Cloudflare Worker config for the Curfew license issuer.
#
# The Worker lives at `scripts/issue-license.ts`. It receives Lemonsqueezy
# `order_created` webhooks, verifies the signature, and mints a signed
# Ed25519 license key that Lemonsqueezy then delivers in the purchase
# receipt email.
#
# Setup (one-time, per environment):
#
#   1. `npx wrangler kv namespace create LICENSE_KV`
#      Paste the returned id into `kv_namespaces[0].id` below.
#   2. `npx wrangler secret put LEMON_WEBHOOK_SECRET`
#      Value: the HMAC signing secret from Lemonsqueezy → Settings → Webhooks.
#   3. `npx wrangler secret put LICENSE_PRIVATE_KEY`
#      Value: base64url-encoded Ed25519 private key from
#             `scripts/gen-license-keypair.sh`.
#   4. `npx wrangler deploy`

name = "curfew-issue-license"
main = "scripts/issue-license.ts"
compatibility_date = "2025-10-01"

# Route this to a sub-domain once DNS is set up, e.g.:
#   routes = [{ pattern = "license.hypertext.studio/*", zone_name = "hypertext.studio" }]
# Left empty until the zone lands.

# KV namespace used for idempotency — processed order IDs are cached so a
# replayed webhook returns the original license instead of minting a fresh one.
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The Worker reads two secrets at runtime. They are NEVER committed to this
# file — `wrangler secret put` uploads them encrypted. Listed here for
# documentation only.
#   LEMON_WEBHOOK_SECRET — HMAC-SHA256 verification of incoming webhooks.
#   LICENSE_PRIVATE_KEY  — Ed25519 signing key (pair with the public key
#                          embedded in Curfew/Core/Features/LicenseGate.swift).

[observability]
enabled = true
