# Cloudflare Worker config for the Curfew license issuer.
#
# The Worker lives at `scripts/issue-license.ts`. It receives Stripe
# `checkout.session.completed` webhooks (POST), verifies the signature, and
# mints a signed Ed25519 license key. Stripe (Managed Payments / merchant of
# record) emails its own payment receipt; the custom license key is delivered
# by the landing success page via `GET /license?session_id=<id>`.
#
# Setup (one-time, per environment):
#
#   1. `pnpm dlx wrangler@latest kv namespace create LICENSE_KV`
#      Paste the returned id into `kv_namespaces[0].id` below.
#   2. `pnpm dlx wrangler@latest secret put STRIPE_WEBHOOK_SECRET`
#      Value: the signing secret (`whsec_…`) from Stripe → Developers →
#             Webhooks → your endpoint. Add an endpoint subscribed to
#             `checkout.session.completed` pointing at this Worker's POST URL.
#   3. `pnpm dlx wrangler@latest secret put LICENSE_PRIVATE_KEY`
#      Value: base64url-encoded Ed25519 private key from
#             `scripts/gen-license-keypair.sh`.
#   4. `pnpm dlx wrangler@latest deploy`

name = "curfew-issue-license"
main = "scripts/issue-license.ts"
compatibility_date = "2025-10-01"

# Route this to a sub-domain once DNS is set up, e.g.:
#   routes = [{ pattern = "license.hypertext.studio/*", zone_name = "hypertext.studio" }]
# Left empty until the zone lands.

# KV namespace used for (1) idempotency — processed Stripe event IDs are cached
# so a replayed webhook is a no-op instead of minting a fresh license — and
# (2) delivery — the signed key is stored under `session:<id>` so the
# `GET /license?session_id=<id>` route can hand it to the buyer's success page.
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The Worker reads two secrets at runtime. They are NEVER committed to this
# file — `wrangler secret put` uploads them encrypted. Listed here for
# documentation only.
#   STRIPE_WEBHOOK_SECRET — HMAC-SHA256 verification of the `Stripe-Signature`
#                           header on incoming `checkout.session.completed`
#                           webhooks.
#   LICENSE_PRIVATE_KEY   — Ed25519 signing key (pair with the public key
#                           embedded in Curfew/Core/Features/LicenseGate.swift).

[observability]
enabled = true
