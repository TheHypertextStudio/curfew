packages:
  - extension
  - worker
  - landing

# Native deps whose install/build scripts we trust to run (pnpm v11 replaced the
# package.json `pnpm.onlyBuiltDependencies` list with this allowBuilds map).
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260801.1'
  - '@cloudflare/build-output-utils@0.9.1'
  - '@cloudflare/config@0.25.0'
  - '@cloudflare/runtime-types@0.1.10'
  - cf@1.0.0-beta.16
  - miniflare@5.20261006.2-beta
