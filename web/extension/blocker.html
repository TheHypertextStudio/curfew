<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request access · Curfew</title>
    <link rel="stylesheet" href="blocker.css">
  </head>
  <body>
    <main class="request" aria-labelledby="task-title">
      <div class="brand" aria-label="Curfew">
        <img src="icons/icon-32.png" alt="" width="32" height="32">
        <span>Curfew</span>
      </div>

      <section class="request__body">
        <h1 class="task" id="task-title">Loading current task…</h1>
        <p class="host" id="target-host">Loading destination…</p>
        <p class="question" id="question">Loading access question…</p>

        <form id="review-form">
          <textarea
            id="justification"
            name="justification"
            aria-labelledby="question"
            maxlength="8192"
            required
            rows="5"
            autocomplete="off"
            spellcheck="true"
          ></textarea>

          <div class="actions">
            <button id="submit" type="submit">Request access</button>
            <p id="status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="blocker.js"></script>
  </body>
</html>
