packages: []
# Reviewed immutable internal release only; retain pnpm's default age for every other version.
minimumReleaseAgeExclude:
  - '@thehypertextstudio/web-config@0.0.1'
  - '@thehypertextstudio/web-docs@0.0.1'
  - '@thehypertextstudio/web-tokens@0.0.1'
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  keytar: true
  puppeteer: false
  sharp: true
  workerd: true
packageExtensions:
  '@mintlify/cli@4.0.1457':
    dependencies:
      react-dom: 19.2.3
