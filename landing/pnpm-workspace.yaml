packages:
  - hosting
# Reviewed immutable internal release only; retain pnpm's default age for every other version.
minimumReleaseAgeExclude:
  - '@thehypertextstudio/web-config@0.0.3'
  - '@thehypertextstudio/format-config@0.0.1'
  - '@thehypertextstudio/web-docs@0.0.1'
  - '@thehypertextstudio/web-tokens@0.0.1'
  - '@cloudflare/build-output-utils@0.9.1'
  - '@cloudflare/config@0.25.0'
  - '@cloudflare/runtime-types@0.1.10'
  - cf@1.0.0-beta.16
  - miniflare@5.20261006.2-beta
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  keytar: true
  puppeteer: false
  sharp: true
  workerd: true
packageExtensions:
  '@mintlify/cli@4.0.1457':
    dependencies:
      react-dom: 19.2.3
