schema: 1
product: curfew-website
repository: TheHypertextStudio/curfew
owner_repository: TheHypertextStudio/curfew
toolchain:
  python: '>=3.11'
  node: '24.20.0'
  pnpm: '11.9.0'
components:
  - id: marketing
    kind: static-site
    path: .
    checks:
      - name: Website validation
        argv: [pnpm, site:check]
      - name: Docs validation
        argv: [pnpm, docs:check]
    dev: [pnpm, dev]
    build:
      script: build
      output: build/site-candidate
# The published v0.1.7 engine includes Workers support. Enable deployment only after
# a shared caller selects this landing/ root and the actual preview is captured.
release:
  channels: []
  next_version: 0.1.0
  required_checks: [Website validation, Docs validation]
  required_evidence: []
