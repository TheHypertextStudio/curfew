name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    name: Format · Lint · Test · Build
    uses: TheHypertextStudio/release-engineering/.github/workflows/validate.yml@83e35d9382bdfa6470fbdd84e033f8488e325e78
    with:
      tooling_revision: 83e35d9382bdfa6470fbdd84e033f8488e325e78
  screenshots:
    name: Render snapshot fixtures
    # Native snapshot fixtures require the app's macOS deployment target.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode.app; do
            if [ -d "$candidate" ] && [ "$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version | head -n 1)" = "Xcode 26.6" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 26.6 is required for screenshot capture" >&2
          exit 1

      - name: Install tools
        run: brew install just

      - name: Cache derived data
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-derived-

      - name: Render headless snapshot fixtures
        run: |
          xcodebuild test -project Curfew.xcodeproj -scheme Curfew \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath build -jobs 2 -parallel-testing-enabled NO \
            -only-testing:CurfewTests/DestinationSnapshotTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload snapshot fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: curfew-snapshots
          path: build/snapshots/curfew-*.png
          if-no-files-found: error
