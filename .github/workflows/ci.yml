name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    name: Format · Lint · Test · Build
    uses: TheHypertextStudio/release-engineering/.github/workflows/validate.yml@8b43fa0cf0e5935774bf0a9dc0f68bf579ab789c
    with:
      tooling_revision: 8b43fa0cf0e5935774bf0a9dc0f68bf579ab789c
  screenshots:
    name: Capture screenshots
    # Screenshot capture launches the app and therefore needs the same macOS
    # deployment-target support as the test job.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode.app; do
            if [ -d "$candidate" ] && [ "$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version | head -n 1)" = "Xcode 26.6" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "Xcode 26.6 is required for screenshot capture" >&2
          exit 1

      - name: Install tools
        run: brew install just

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-derived-

      # Drives the demo-fixture scenarios through XCUITest and exports the
      # screenshots. Uses XCUIScreen.screenshot(), so no Screen Recording
      # permission is needed on the runner. The walkthrough video and the
      # shadowed per-window hero stills are local-only (they need that
      # permission) — see scripts/capture-marketing.sh / capture-video.sh.
      - name: Capture demo screenshots
        env:
          CURFEW_XCODEBUILD_SETTINGS: "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -jobs 2 -parallel-testing-enabled NO"
        run: just capture

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curfew-screenshots
          path: build/screenshots/curfew-*.png
          if-no-files-found: warn
