name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format · Lint · Test · Build
    # Curfew's deployment target is macOS 26, so validation must run on a
    # runner that can actually build and execute its test host.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Install tools
        run: brew install swiftlint swiftformat just

      - name: Cache derived data
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-derived-

      - name: Verify integrated package layout
        run: node --test scripts/*.test.mjs

      - name: Test shared package and executable contracts
        run: swift test --package-path CurfewKit

      - name: Check (format + lint + test + build)
        env:
          CURFEW_XCODEBUILD_SETTINGS: "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
        run: just check

      - name: Compile Release
        env:
          CURFEW_XCODEBUILD_SETTINGS: "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
        run: just build-release

      - name: Upload unit-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-unit-test-results
          path: build/CurfewTests.xcresult
          if-no-files-found: warn

  screenshots:
    name: Capture screenshots
    # Screenshot capture launches the app and therefore needs the same macOS
    # deployment-target support as the test job.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Install tools
        run: brew install just displayplacer

      - name: Cache derived data
        uses: actions/cache@v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: ${{ runner.os }}-derived-

      # Drives the demo-fixture scenarios through XCUITest and exports the
      # screenshots. Uses XCUIScreen.screenshot(), so no Screen Recording
      # permission is needed on the runner. The walkthrough video and the
      # shadowed per-window hero stills are local-only (they need that
      # permission) — see scripts/capture-marketing.sh / capture-video.sh.
      - name: Configure isolated capture display
        run: node scripts/configure-ci-display.mjs

      - name: Keep app captures unobstructed
        run: |
          defaults write com.apple.dock autohide -bool true
          defaults write com.apple.dock autohide-delay -float 1000
          killall Dock || true

      - name: Verify screenshot capture failure handling
        run: node --test scripts/extract-screenshots.test.mjs scripts/configure-ci-display.test.mjs

      - name: Verify UI interactions on the isolated runner
        run: >-
          xcodebuild test -project Curfew.xcodeproj -scheme Curfew
          -destination 'platform=macOS'
          -resultBundlePath build/interactions.xcresult
          -only-testing:CurfewUITests/CurfewUITests
          -only-testing:CurfewUITests/CurfewUITestsLaunchTests
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Verify state fixtures before the full capture sweep
        run: >-
          xcodebuild test -project Curfew.xcodeproj -scheme Curfew
          -destination 'platform=macOS' -derivedDataPath build
          -resultBundlePath build/state-consistency.xcresult
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyOffLocked
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencySetupReview
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencySetupPermission
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyExhaustedRequest
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyMalformedRequest
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyAccountOffline
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyAccountSignIn
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyAccountHelper
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyAccountUpdate
          -only-testing:CurfewUITests/MarketingCaptureTests/testCaptureAStateConsistencyAccountUnavailable
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Capture demo screenshots
        env:
          CURFEW_XCODEBUILD_SETTINGS: "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
        run: just capture

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-screenshots
          path: build/screenshots/curfew-*.png
          if-no-files-found: warn

      - name: Upload screenshot-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-screenshot-test-results
          path: |
            build/screenshots.xcresult
            build/interactions.xcresult
            build/state-consistency.xcresult
          if-no-files-found: warn
