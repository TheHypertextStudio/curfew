name: Website and docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  packages: read

jobs:
  website:
    name: Website validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install reviewed registry lock
        run: pnpm --dir landing install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Generate immutable deployment configuration
        run: |
          node scripts/deployment-config.mjs generate
          node scripts/check-deployment-hosts.mjs
          git diff --exit-code -- CurfewKit/Sources/CurfewKit/Sync/DeploymentProfile.generated.swift deployment/generated Curfew/Curfew.entitlements Curfew/Curfew-Release.entitlements landing/public
      - name: Validate website source
        run: pnpm site:check
      - name: Validate cf Worker packaging
        run: |
          pnpm --dir landing/hosting exec cf build --mode staging
          pnpm --dir landing/hosting exec cf deploy --prebuilt --mode staging --dry-run
      - name: Install browser runtimes
        run: pnpm --dir landing exec playwright install --with-deps chromium firefox webkit
      - name: Accept local Worker runtime in three browsers
        run: pnpm site:test:acceptance
      - name: Retain validated website output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-website-dist
          path: landing/dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain deployment configuration identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-deployment-configuration
          path: deployment/generated/environment-artifact.json
          if-no-files-found: error
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-website-browser-results
          path: test-results/
          if-no-files-found: ignore

  docs:
    name: Docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install pinned docs tooling
        run: pnpm --dir landing install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Validate generated config, MDX, links and accessibility
        run: pnpm docs:check
