name: Website and docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  packages: read

jobs:
  license:
    name: License Worker validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
      - run: pnpm --dir web/worker install --frozen-lockfile
      - name: Validate shared configuration and Worker behavior
        run: |
          node --test web/worker/test/*.node.mjs
          pnpm --dir web/worker test
          pnpm --dir web/worker typecheck
      - name: Prepare immutable configuration identity
        run: |
          node scripts/deployment-config.mjs generate
          echo "CURFEW_CONFIGURATION_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "CURFEW_CONFIGURATION_SHA256=$(jq -r .sha256 deployment/generated/environment-artifact.json)" >> "$GITHUB_ENV"
      - name: Build and validate the same cf artifact
        env:
          CURFEW_DEPLOYMENT_ARTIFACT: ${{ github.workspace }}/deployment/generated/environment-artifact.json
        run: |
          pnpm --dir web/worker exec cf build --mode production
          pnpm --dir web/worker exec cf deploy --prebuilt --mode production --dry-run

  website:
    name: Website validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install reviewed registry lock
        run: pnpm --dir landing install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Generate immutable deployment configuration
        run: |
          node scripts/deployment-config.mjs generate
          node scripts/check-deployment-hosts.mjs
          git diff --exit-code -- CurfewKit/Sources/CurfewKit/Sync/DeploymentProfile.generated.swift deployment/generated Curfew/Curfew.entitlements Curfew/Curfew-Release.entitlements landing/public
      - name: Validate website source
        run: pnpm site:check
      - name: Validate cf Worker packaging
        run: |
          pnpm --dir landing/hosting exec cf build --mode staging
          pnpm --dir landing/hosting exec cf deploy --prebuilt --mode staging --dry-run
      - name: Install browser runtimes
        run: pnpm --dir landing exec playwright install --with-deps chromium firefox webkit
      - name: Accept local Worker runtime in three browsers
        run: pnpm site:test:acceptance
      - name: Compile and verify the retained Pages middleware
        run: |
          pnpm --dir landing exec wrangler pages functions build functions --outdir dist/_worker.js --build-output-directory dist --output-routes-path dist/_routes.json
          node --test scripts/pages-bundle.node.mjs
          node scripts/pages-artifact.mjs landing/dist deployment/generated/environment-artifact.json deployment/generated/website-build.json
      - name: Retain validated website output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-website-dist
          path: landing/dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain deployment configuration identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-deployment-configuration
          path: deployment/generated/environment-artifact.json
          if-no-files-found: error
      - name: Retain website build identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curfew-website-build
          path: deployment/generated/website-build.json
          if-no-files-found: error
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: curfew-website-browser-results
          path: test-results/
          if-no-files-found: ignore

  docs:
    name: Docs validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install pinned docs tooling
        run: pnpm --dir landing install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Validate generated config, MDX, links and accessibility
        run: pnpm docs:check
