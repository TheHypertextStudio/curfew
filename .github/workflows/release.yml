name: Release prerequisites
on:
  workflow_dispatch:
    inputs:
      migration_public_key:
        description: Optional public RSA recipient for scoped updater-key migration
        type: string
        required: false
permissions:
  contents: read
jobs:
  diagnose:
    uses: TheHypertextStudio/release-engineering/.github/workflows/diagnose.yml@8b43fa0cf0e5935774bf0a9dc0f68bf579ab789c
    with:
      migration_public_key: ${{ inputs.migration_public_key }}
      tooling_revision: 8b43fa0cf0e5935774bf0a9dc0f68bf579ab789c
    secrets: inherit
