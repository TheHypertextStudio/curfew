name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Archive · Sign · Notarize · DMG
    # The deployment target is macOS 26 (Tahoe), which requires Xcode 26 — so
    # the runner must be a macOS 26 image. If GitHub has not yet promoted
    # `macos-26` out of preview, pin it to the preview label (e.g.
    # `macos-26-large`) or self-host. The Select Xcode step below falls back to
    # the newest installed Xcode, so a label bump is usually all that's needed.
    runs-on: macos-26
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        # Prefer Xcode 26 (required for the macOS 26 / Tahoe deployment target);
        # fall back to the newest installed Xcode if that exact path is absent,
        # so a runner-image refresh doesn't silently break the build.
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Install tools
        run: brew install create-dmg swiftlint swiftformat just

      - name: Set up frontend Node and registry
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: '@thehypertextstudio'

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Reject placeholder license public key
        # Refuses to release if LicenseGate.swift still embeds the all-zero
        # placeholder in the ACTIVE `configuredPublicKeyBase64` constant. Without
        # this gate, a forgotten key swap would ship a build that silently
        # accepts attacker-forged license keys. The match is scoped to the
        # `configuredPublicKeyBase64 =` assignment so the intentional all-zero
        # `placeholderPublicKeyBase64` sentinel does not trip the guard.
        run: |
          if grep -E 'configuredPublicKeyBase64[[:space:]]*=' \
               Curfew/Core/Features/LicenseGate.swift \
               | grep -q 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='; then
            echo "::error::LicenseGate.swift still embeds the placeholder Ed25519 public key."
            echo "Run node scripts/license-worker.mjs keygen --private-key-path <secure-path> and paste the public key before tagging."
            exit 1
          fi

      - name: Require release secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"

      - name: Derive the retained Sparkle public key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          public_key=$(node scripts/sparkle-public-key.mjs)
          echo "CURFEW_SPARKLE_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Run quality gate
        run: just check

      - name: Archive
        run: |
          # Derive the build + marketing version from the tag so the shipped
          # CFBundleVersion matches the appcast's <sparkle:version> — Sparkle
          # compares those to decide whether an update is newer. Strip the 'v'.
          VERSION="${{ github.ref_name }}"; VERSION="${VERSION#v}"
          xcodebuild archive \
            -project Curfew.xcodeproj \
            -scheme Curfew \
            -archivePath "$RUNNER_TEMP/Curfew.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            MARKETING_VERSION="$VERSION" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            INFOPLIST_KEY_SUPublicEDKey="$CURFEW_SPARKLE_PUBLIC_KEY"

      - name: Export app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Curfew.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          echo "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Curfew.app" "$RUNNER_TEMP/Curfew.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Curfew.zip" \
            --issuer "$APPLE_API_ISSUER" \
            --key-id "$APPLE_API_KEY_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/Curfew.app"

      - name: Verify signed app artifact
        run: |
          embedded_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$RUNNER_TEMP/export/Curfew.app/Contents/Info.plist")
          [[ "$embedded_key" == "$CURFEW_SPARKLE_PUBLIC_KEY" ]] || { echo 'Archive does not embed the retained Sparkle public key.' >&2; exit 1; }
          bash scripts/verify-release-artifact.sh "$RUNNER_TEMP/export/Curfew.app"

      - name: Build DMG
        run: |
          bash scripts/build-dmg.sh \
            "$RUNNER_TEMP/export/Curfew.app" \
            "$RUNNER_TEMP/Curfew-${{ github.ref_name }}.dmg"

      - name: Sign and notarize DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          DMG="$RUNNER_TEMP/Curfew-${{ github.ref_name }}.dmg"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG"
          xcrun notarytool submit "$DMG" \
            --issuer "$APPLE_API_ISSUER" \
            --key-id "$APPLE_API_KEY_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Generate appcast
        env:
          # scripts/generate-appcast.sh signs the DMG with the Sparkle private
          # key (Ed25519 seed) and emits a signed appcast.xml. Keep the key in
          # the env only — never echo it.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is required}"
          # github.ref_name is the tag (e.g. v1.0.1); the script wants a bare
          # semver for <sparkle:version>/shortVersionString, so strip the 'v'.
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          export VERSION
          export DMG_PATH="$RUNNER_TEMP/Curfew-${{ github.ref_name }}.dmg"
          # The following publication step uploads this exact signed DMG.
          # Generate its signature first so signing failures stop publication.
          export APPCAST_URL_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          bash scripts/generate-appcast.sh > "$RUNNER_TEMP/appcast.xml"

      - name: Publish signed DMG
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ runner.temp }}/Curfew-${{ github.ref_name }}.dmg
          generate_release_notes: true

      - name: Attach signed appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/appcast.xml" --clobber

      - name: Set up frontend package manager
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0

      - name: Install frontend from the reviewed lock
        run: pnpm --dir landing install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Deploy live appcast
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          cp "$RUNNER_TEMP/appcast.xml" landing/public/appcast.xml
          pnpm --dir landing deploy:pages

      - name: Verify live appcast
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://curfew.hypertext.studio/appcast.xml \
              -o "$RUNNER_TEMP/live-appcast.xml" \
              && cmp "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/live-appcast.xml"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::live Sparkle feed does not match the signed release appcast"
          exit 1
