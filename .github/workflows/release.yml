name: Release prerequisites
on:
  workflow_dispatch:
    inputs:
      migration_public_key:
        description: Optional public RSA recipient for scoped updater-key migration
        type: string
        required: false
permissions:
  contents: read
jobs:
  diagnose:
    uses: TheHypertextStudio/release-engineering/.github/workflows/diagnose.yml@83e35d9382bdfa6470fbdd84e033f8488e325e78
    with:
      migration_public_key: ${{ inputs.migration_public_key }}
      tooling_revision: 83e35d9382bdfa6470fbdd84e033f8488e325e78
    secrets: inherit
