name: Release prerequisites
on:
  workflow_dispatch:
    inputs:
      migration_public_key:
        description: Optional public RSA recipient for scoped updater-key migration
        type: string
        required: false
permissions:
  contents: read
jobs:
  diagnose:
    uses: TheHypertextStudio/release-engineering/.github/workflows/diagnose.yml@e57006fd9f3c0f4d499c7c295017769727c08f25
