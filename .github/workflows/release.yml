name: Release prerequisites
on:
  workflow_dispatch:
    inputs:
      migration_public_key:
        description: Optional public RSA recipient for scoped updater-key migration
        type: string
        required: false
permissions:
  contents: read
jobs:
  diagnose:
    uses: TheHypertextStudio/release-engineering/.github/workflows/diagnose.yml@d2cc95ed85886e95e2e05cbae7c40285e6d8cc4f
    with:
      migration_public_key: ${{ inputs.migration_public_key }}
      tooling_revision: d2cc95ed85886e95e2e05cbae7c40285e6d8cc4f
    secrets: inherit
