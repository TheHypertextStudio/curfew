name: Release prerequisites
on:
  workflow_dispatch:
    inputs:
      migration_public_key:
        description: Optional public RSA recipient for scoped updater-key migration
        type: string
        required: false
permissions:
  contents: read
jobs:
  diagnose:
    uses: TheHypertextStudio/release-engineering/.github/workflows/diagnose.yml@23e6c0b0c82486b33ed54fc3b438b61bc8c3a66b
    with:
      migration_public_key: ${{ inputs.migration_public_key }}
      tooling_revision: 23e6c0b0c82486b33ed54fc3b438b61bc8c3a66b
    secrets: inherit
