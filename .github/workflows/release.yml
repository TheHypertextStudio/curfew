name: Signed release candidate

on:
  push:
    tags:
      - "v0.0.*"

jobs:
  release:
    name: Archive · Sign · Notarize · DMG
    # The deployment target is macOS 26 (Tahoe), which requires Xcode 26 — so
    # the runner must be a macOS 26 image. If GitHub has not yet promoted
    # `macos-26` out of preview, pin it to the preview label (e.g.
    # `macos-26-large`) or self-host. The Select Xcode step below falls back to
    # the newest installed Xcode, so a label bump is usually all that's needed.
    runs-on: macos-26
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate candidate identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PUBLIC_RETENTION_APPROVED: ${{ vars.CURFEW_PUBLIC_CANDIDATE_RETENTION_APPROVED }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v0\.0\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$APPLE_TEAM_ID" == T95VDD3A4W ]] || exit 1
          if [[ "$PUBLIC_RETENTION_APPROVED" != true ]]; then
            echo '::error::Candidate retention is public to signed-in repository readers. Explicit owner exposure approval or a reviewed private retention path is required.'
            exit 1
          fi

      - name: Select Xcode
        # Prefer Xcode 26 (required for the macOS 26 / Tahoe deployment target);
        # fall back to the newest installed Xcode if that exact path is absent,
        # so a runner-image refresh doesn't silently break the build.
        run: |
          if [ -d /Applications/Xcode_26.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Install tools
        run: brew install create-dmg swiftlint swiftformat just

      - name: Generate shared deployment configuration
        run: node scripts/deployment-config.mjs generate

      - name: Reject placeholder license public key
        # Refuses to release if LicenseGate.swift still embeds the all-zero
        # placeholder in the ACTIVE `configuredPublicKeyBase64` constant. Without
        # this gate, a forgotten key swap would ship a build that silently
        # accepts attacker-forged license keys. The match is scoped to the
        # `configuredPublicKeyBase64 =` assignment so the intentional all-zero
        # `placeholderPublicKeyBase64` sentinel does not trip the guard.
        run: |
          if grep -E 'configuredPublicKeyBase64[[:space:]]*=' \
               Curfew/Core/Features/LicenseGate.swift \
               | grep -q 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='; then
            echo "::error::LicenseGate.swift still embeds the placeholder Ed25519 public key."
            echo "Run node scripts/license-worker.mjs keygen --private-key-path <secure-path> and paste the public key before tagging."
            exit 1
          fi

      - name: Resolve and verify Release update key before archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_PUBLIC_KEY=$(node scripts/release-candidate.mjs derive-update-key)
          printf 'SPARKLE_PUBLIC_KEY=%s\n' "$SPARKLE_PUBLIC_KEY" >> "$GITHUB_ENV"
          env -u SPARKLE_PRIVATE_KEY xcodebuild -showBuildSettings -json -project Curfew.xcodeproj -scheme Curfew \
            -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            INFOPLIST_KEY_SUPublicEDKey="$SPARKLE_PUBLIC_KEY" > "$RUNNER_TEMP/release-build-settings.json"
          node scripts/release-candidate.mjs verify-update-key "$RUNNER_TEMP/release-build-settings.json"
          node scripts/release-configuration.mjs record "$RUNNER_TEMP/release-build-settings.json" "$RUNNER_TEMP/release-configuration.json" > "$RUNNER_TEMP/release-configuration.sha256"
          configuration_hash=$(node -p "JSON.parse(require('fs').readFileSync('deployment/generated/environment-artifact.json')).sha256")
          printf 'CURFEW_CONFIGURATION_SHA256=%s\n' "$configuration_hash" >> "$GITHUB_ENV"

      - name: Run quality gate
        env:
          CURFEW_XCODEBUILD_SETTINGS: "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
        run: just check

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Install approved production provisioning profiles
        env:
          APPLE_PROVISIONING_PROFILES: ${{ secrets.APPLE_PROVISIONING_PROFILES }}
        run: node scripts/release-profiles.mjs install

      - name: Archive
        run: |
          # Derive the build + marketing version from the tag so the shipped
          # CFBundleVersion matches the appcast's <sparkle:version> — Sparkle
          # compares those to decide whether an update is newer. Strip the 'v'.
          VERSION="${{ github.ref_name }}"; VERSION="${VERSION#v}"
          xcodebuild archive \
            -project Curfew.xcodeproj \
            -scheme Curfew \
            -configuration Release \
            -xcconfig "$RUNNER_TEMP/provisioning.xcconfig" \
            -destination 'platform=macOS' \
            -archivePath "$RUNNER_TEMP/Curfew.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            MARKETING_VERSION="$VERSION" \
            INFOPLIST_KEY_SUPublicEDKey="$SPARKLE_PUBLIC_KEY" \
            CURFEW_CONFIGURATION_COMMIT="$GITHUB_SHA" \
            CURFEW_CONFIGURATION_SHA256="$CURFEW_CONFIGURATION_SHA256" \
            DEVELOPMENT_TEAM=T95VDD3A4W

      - name: Export app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Curfew.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          echo "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Curfew.app" "$RUNNER_TEMP/Curfew.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Curfew.zip" \
            --issuer "$APPLE_API_ISSUER" \
            --key-id "$APPLE_API_KEY_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --wait --output-format json > "$RUNNER_TEMP/app-notarization.json"
          xcrun stapler staple "$RUNNER_TEMP/export/Curfew.app"

      - name: Verify signed app artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/verify-release-artifact.sh "$RUNNER_TEMP/export/Curfew.app" "$RUNNER_TEMP/release-configuration.json" "${RELEASE_TAG#v}"

      - name: Build DMG
        run: |
          bash scripts/build-dmg.sh \
            "$RUNNER_TEMP/export/Curfew.app" \
            "$RUNNER_TEMP/Curfew-${{ github.ref_name }}.dmg"

      - name: Sign and notarize DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          DMG="$RUNNER_TEMP/Curfew-${{ github.ref_name }}.dmg"
          codesign --force --timestamp --sign "Developer ID Application" "$DMG"
          xcrun notarytool submit "$DMG" \
            --issuer "$APPLE_API_ISSUER" \
            --key-id "$APPLE_API_KEY_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --wait --output-format json > "$RUNNER_TEMP/dmg-notarization.json"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Generate appcast
        env:
          # scripts/generate-appcast.sh signs the DMG with the Sparkle private
          # key (Ed25519 seed) and emits a signed appcast.xml. Keep the key in
          # the env only — never echo it.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          : "${SPARKLE_PRIVATE_KEY:?SPARKLE_PRIVATE_KEY is required}"
          # github.ref_name is the tag (e.g. v0.0.1); the script wants a bare
          # semver for <sparkle:version>/shortVersionString, so strip the 'v'.
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          export VERSION
          export DMG_PATH="$RUNNER_TEMP/Curfew-${{ github.ref_name }}.dmg"
          # Future activation uploads these exact bytes to this URL. A tag
          # retains the feed; it does not make the enclosure publicly available.
          export APPCAST_URL_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          bash scripts/generate-appcast.sh > "$RUNNER_TEMP/appcast.xml"

      - name: Seal candidate bytes and configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/Curfew-$RELEASE_TAG.dmg" "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/release-configuration.json" deployment/generated/environment-artifact.json "$RUNNER_TEMP/candidate/"
          cp "$RUNNER_TEMP/app-notarization.json" "$RUNNER_TEMP/dmg-notarization.json" "$RUNNER_TEMP/candidate/"
          export VERSION="${RELEASE_TAG#v}"
          CANDIDATE_TEAM="$(codesign -dv --verbose=4 "$RUNNER_TEMP/export/Curfew.app" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          SPARKLE_PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$RUNNER_TEMP/export/Curfew.app/Contents/Info.plist")"
          export CANDIDATE_TEAM SPARKLE_PUBLIC_KEY
          node scripts/release-candidate.mjs record "$RUNNER_TEMP/candidate"

      - name: Remove transient signing credentials
        if: always()
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          if [[ -e "$RUNNER_TEMP/signing.keychain-db" ]]; then
            if ! security delete-keychain "$RUNNER_TEMP/signing.keychain-db" >/dev/null 2>&1; then
              echo '::error::Cannot remove temporary signing.keychain-db'
              exit 1
            fi
          fi
          if ! rm -f -- "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8" >/dev/null 2>&1; then
            echo '::error::Cannot remove transient certificate.p12 and AuthKey.p8'
            exit 1
          fi
          for name in signing.keychain-db certificate.p12 AuthKey.p8; do
            [[ ! -e "$RUNNER_TEMP/$name" ]] || { echo "::error::Temporary $name remains"; exit 1; }
          done

      - name: Remove job-installed provisioning profiles
        if: always()
        run: node scripts/release-profiles.mjs cleanup

      - name: Retain signed candidate without activation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curfew-signed-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
