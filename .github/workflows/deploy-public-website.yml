name: Deploy public website

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: curfew-production-activation
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'TheHypertextStudio/curfew' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: "2500680a3b2b0fe6a011c1c25fed5008"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select successful website checks for this exact main commit
        id: website
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow website.yml --event push --branch main --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo 'Successful website validation is required for this exact main commit.' >&2; exit 1; }
          mkdir .public-website
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > .public-website/website-run.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install pinned cf and retained Pages uploader
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir landing install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: curfew-website-dist
          path: .public-website/website/
          run-id: ${{ steps.website.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: curfew-website-build
          path: .public-website/website-build/
          run-id: ${{ steps.website.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: curfew-deployment-configuration
          path: .public-website/identity/
          run-id: ${{ steps.website.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Inspect existing Pages infrastructure through cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node_modules/.bin/cf pages domains list --project-name curfew-landing > .public-website/pages-domains.json
          node_modules/.bin/cf pages get curfew-landing | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const j=JSON.parse(s);const p=j.result??j;console.log(JSON.stringify({name:p.name,previousDeploymentID:p.canonical_deployment?.id}));' > .public-website/pages-project.json
          node_modules/.bin/cf pages deployments list --project-name curfew-landing --env production | node --input-type=module -e 'let s="";for await(const c of process.stdin)s+=c;const j=JSON.parse(s);console.log(JSON.stringify((j.result??j).map(p=>({id:p.id,url:p.url,environment:p.environment,created_on:p.created_on,status:p.latest_stage?.status}))));' > .public-website/pages-deployments.json
      - name: Prepare only the public website and preserve existing service access
        run: |
          node --test scripts/public-website.test.mjs
          node scripts/public-website.mjs prepare .public-website
      - name: Publish the retained public artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo 'Main changed before publication.' >&2; exit 1; }
          upload_directory=$(mktemp -d "$RUNNER_TEMP/curfew-public-pages.XXXXXX")
          cd "$upload_directory"
          "$GITHUB_WORKSPACE/landing/node_modules/.bin/wrangler" pages deploy "$GITHUB_WORKSPACE/.public-website/site-ready" --project-name curfew-landing --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false --no-bundle
      - name: Verify the live public cutover
        run: node scripts/public-website.mjs verify .public-website
      - name: Retain publication and rollback records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: curfew-public-website-publication
          path: |
            .public-website/publication.json
            .public-website/pages-project.json
            .public-website/pages-deployments.json
          if-no-files-found: ignore
