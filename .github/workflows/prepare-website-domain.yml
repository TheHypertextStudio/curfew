name: Prepare website domain

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, preview, or attach the configured production Pages hostname
        required: true
        default: preview
        type: choice
        options: [status, preview, attach]
      configuration_commit:
        description: Exact reviewed configuration source commit
        required: true
        type: string
      configuration_sha256:
        description: Reviewed configuration manifest SHA-256
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: curfew-website-domain-preparation
  cancel-in-progress: false

jobs:
  domain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CURFEW_CONFIGURATION_COMMIT: ${{ inputs.configuration_commit }}
      CURFEW_CONFIGURATION_SHA256: ${{ inputs.configuration_sha256 }}
      CURFEW_CONFIGURATION_SOURCE: .configuration-source
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate immutable configuration identity
        run: |
          [[ "$CURFEW_CONFIGURATION_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CURFEW_CONFIGURATION_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.configuration_commit }}
          path: .configuration-source
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
      - name: Install the configuration source's pinned cf release
        run: pnpm --dir .configuration-source install --frozen-lockfile
      - name: Verify operation tests and configuration artifact
        run: |
          node --test scripts/pages-domain.test.mjs
          test "$(git -C .configuration-source rev-parse HEAD)" = "$CURFEW_CONFIGURATION_COMMIT"
          node .configuration-source/scripts/deployment-config.mjs generate
      - name: Prepare only the existing Pages project's configured hostname
        env:
          CLOUDFLARE_ACCOUNT_ID: "2500680a3b2b0fe6a011c1c25fed5008"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CURFEW_PAGES_ACTION: ${{ inputs.action }}
        run: node scripts/pages-domain.mjs "$CURFEW_PAGES_ACTION"
