name: Promote reviewed candidate
on:
  workflow_dispatch:
    inputs:
      release_action:
        description: Action on the reviewed candidate
        type: choice
        options: [promote, reconcile-one, withdraw]
        default: promote
        required: true
      candidate_id:
        description: Immutable candidate run-id and attempt
        type: string
        required: true
      manifest_sha256:
        description: Reviewed candidate manifest SHA-256
        type: string
        required: true
      evidence:
        description: Candidate-bound release review JSON
        type: string
        required: true
permissions:
  contents: write
  actions: read
  packages: read
  id-token: write
jobs:
  promote:
    uses: TheHypertextStudio/release-engineering/.github/workflows/promote.yml@83e35d9382bdfa6470fbdd84e033f8488e325e78
    with:
      tooling_revision: 83e35d9382bdfa6470fbdd84e033f8488e325e78
      release_action: ${{ inputs.release_action }}
      candidate_id: ${{ inputs.candidate_id }}
      manifest_sha256: ${{ inputs.manifest_sha256 }}
      evidence: ${{ inputs.evidence }}
    secrets: inherit
