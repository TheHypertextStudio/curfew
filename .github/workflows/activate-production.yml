name: Activate verified production release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful signed candidate run for the current main commit
        required: true
        type: string
      website_run_id:
        description: Successful main website validation run for the same commit
        required: true
        type: string
      receipt_sha256:
        description: SHA-256 of the owner-approved private acceptance receipt
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: curfew-production-activation
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      WEBSITE_RUN_ID: ${{ inputs.website_run_id }}
      RECEIPT_SHA256: ${{ inputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate immutable input identities
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WEBSITE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECEIPT_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install pinned publication tools
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir landing install --frozen-lockfile
      - name: Read source workflow records
        run: |
          mkdir -p .publication
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > .publication/candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WEBSITE_RUN_ID" > .publication/website-run.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: curfew-signed-candidate
          path: .publication/candidate/
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: curfew-website-dist
          path: .publication/website/
          run-id: ${{ inputs.website_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: curfew-website-build
          path: .publication/website-build/
          run-id: ${{ inputs.website_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: curfew-deployment-configuration
          path: .publication/identity/
          run-id: ${{ inputs.website_run_id }}
          github-token: ${{ github.token }}
      - name: Load the approved private receipt
        env:
          OWNER_RECEIPT: ${{ secrets.CURFEW_RELEASE_ACCEPTANCE_RECEIPT }}
        run: |
          mkdir -p .publication
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const receipt=process.env.OWNER_RECEIPT;
          if(!receipt || createHash('sha256').update(receipt).digest('hex')!==process.env.RECEIPT_SHA256) throw new Error('Missing or mismatched owner receipt');
          JSON.parse(receipt);
          writeFileSync('.publication/owner-receipt.json',receipt,{mode:0o600,flag:'wx'});
          JS
      - name: Verify retained bytes and owner acceptance
        run: node scripts/publication.mjs prepare .publication
      - name: Verify website TLS and prepared services
        run: node scripts/publication.mjs ready .publication
      - name: Publish the verified signed release without replacing assets
        run: node scripts/publication.mjs publish .publication
      - name: Publish the same Worker assets and signed update feed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2500680a3b2b0fe6a011c1c25fed5008"
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo 'Main changed before Worker publication.' >&2; exit 1; }
          export CURFEW_WEBSITE_ASSETS_DIRECTORY="$GITHUB_WORKSPACE/.publication/site-ready"
          pnpm --dir landing/hosting exec cf build --mode production
          pnpm --dir landing/hosting exec cf deploy --prebuilt --mode production --dry-run --provision=false
          pnpm --dir landing/hosting exec cf deploy --prebuilt --mode production --provision=false
      - name: Verify live site, feed, redirect, and retirement
        run: node scripts/publication.mjs verify .publication
      - name: Remove the private owner receipt
        if: always()
        run: rm -f -- .publication/owner-receipt.json
