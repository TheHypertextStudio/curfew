name: Deploy website staging

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: curfew-website-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy validated main website
    if: github.repository == 'TheHypertextStudio/curfew' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select successful website checks for this main commit
        id: website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow website.yml \
            --event push --branch main --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Successful Website and docs checks are required for this exact commit.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          scope: "@thehypertextstudio"
      - name: Install pinned deployment tooling
        run: pnpm --dir landing install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Download the validated static output
        uses: actions/download-artifact@v8.0.2
        with:
          name: curfew-website-staging-dist
          path: landing/dist/
          run-id: ${{ steps.website.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download staging website identity
        uses: actions/download-artifact@v8.0.2
        with:
          name: curfew-website-staging-build
          path: deployment/generated/
          run-id: ${{ steps.website.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download shared deployment identity
        uses: actions/download-artifact@v8.0.2
        with:
          name: curfew-deployment-configuration
          path: deployment/generated/
          run-id: ${{ steps.website.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify retained staging purchase environment
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createArtifact} from './scripts/deployment-config.mjs';
          import {verifyWebsite} from './scripts/website-artifact.mjs';
          const json = async path => JSON.parse(await readFile(path, 'utf8'));
          const artifact = await json('deployment/generated/environment-artifact.json');
          const stamp = await json('deployment/generated/staging-website-build.json');
          const expected = createArtifact(await json('deployment/environments.json'), process.env.GITHUB_SHA);
          await verifyWebsite('landing/dist', stamp, artifact, expected.sha256, process.env.GITHUB_SHA, 'staging');
          JS
      - name: Deploy staging with its separate credential
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "2500680a3b2b0fe6a011c1c25fed5008"
        run: |
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'The staging credential is not configured.' >&2; exit 1; }
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || { echo 'Main changed; dispatch the reviewed current commit instead.' >&2; exit 1; }
          pnpm --dir landing/hosting exec cf build --mode staging
          pnpm --dir landing/hosting exec cf deploy --prebuilt --mode staging
